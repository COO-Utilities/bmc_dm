[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmc_dm"
version = "0.1.0"
description = "Single-file driver for BMC deformable mirrors, configured by TOML bundles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "hardware_device_base@git+https://github.com/COO-Utilities/hardware_device_base@v1.0.1",
]

[project.optional-dependencies]
zernike = ["poppy"]
dev = ["pytest>=8", "pylint>=3", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["bmc_dm"]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["bmc", "hardware_device_base", "poppy"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
